name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sekkawy APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Ensure APK naming
        run: |
          cd android/app/build/outputs/apk/debug
          if [ -f app-debug.apk ] && [ ! -f Sekkawy.apk ]; then
            cp app-debug.apk Sekkawy.apk
          fi
          ls -la

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sekkawy-APK
          path: android/app/build/outputs/apk/debug/Sekkawy.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: "Sekkawy v${{ github.run_number }}"
          files: android/app/build/outputs/apk/debug/Sekkawy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

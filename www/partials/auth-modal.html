<!-- ==================================================================
     بطل البلد | partials/auth-modal.html
     ------------------------------------------------------------------
     الصق الكود ده قبل وسم </body> مباشرة في index.html.
     فيه موديلين اتنين:
       1) authModal              -> شاشة تسجيل الدخول / إنشاء حساب
       2) firstTimeProfileModal  -> شاشة "إعداد البطل لأول مرة"
     الاتنين متخفيين بالكلاس hidden، وبيتحكم في ظهورهم js/auth.js
     و js/profile-setup.js.
     ================================================================== -->

<!-- ============================= -->
<!-- 1) موديل تسجيل الدخول         -->
<!-- ============================= -->
<div id="authModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">

    <!-- طبقة الخلفية الداكنة مع تمويه خفيف -->
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <!-- كارت الزجاج الرئيسي -->
    <div class="relative w-full max-w-sm bg-lux-800/60 backdrop-blur-xl border border-gold-500/25
                rounded-3xl shadow-2xl shadow-gold-500/10 p-6 space-y-5 overflow-hidden">

        <!-- إضاءات سيبرانية خلفية داخل الكارت -->
        <div class="pointer-events-none absolute -top-16 -right-16 w-40 h-40 bg-gold-500/20 rounded-full blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-16 -left-16 w-40 h-40 bg-teal-500/10 rounded-full blur-3xl"></div>

        <!-- شعار وعنوان -->
        <div class="relative text-center space-y-1">
            <div class="mx-auto w-14 h-14 rounded-2xl bg-gold-500/10 border border-gold-500/30
                        flex items-center justify-center text-3xl badge-glow">🏆</div>
            <h1 class="text-lux-100 font-extrabold text-xl">بطل البلد</h1>
            <p id="authModalSubtitle" class="text-lux-400 text-xs font-bold">سجّل دخولك وابدأ رحلتك للبطولة</p>
        </div>

        <!-- رسالة خطأ داخل الموديل (تظهر عند فشل تسجيل الدخول) -->
        <p id="authErrorText" class="hidden relative text-rose-400 text-[11px] font-bold text-center
                                       bg-rose-500/10 border border-rose-500/25 rounded-xl px-3 py-2"></p>

        <!-- زرار الدخول بجوجل -->
        <button id="btnGoogleSignIn" type="button"
                class="relative w-full flex items-center justify-center gap-2 bg-lux-100 hover:bg-white
                       text-lux-900 font-extrabold text-sm rounded-2xl py-3 transition-colors">
            <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/>
                <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.4-11.2-8l-6.6 5.1C9.7 39.6 16.3 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.4 35.8 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
            </svg>
            الدخول باستخدام جوجل
        </button>

        <!-- فاصل -->
        <div class="relative flex items-center gap-3">
            <span class="flex-1 h-px bg-gold-500/15"></span>
            <span class="text-lux-500 text-[10px] font-bold">أو بالإيميل</span>
            <span class="flex-1 h-px bg-gold-500/15"></span>
        </div>

        <!-- فورم الإيميل وكلمة المرور -->
        <form id="emailAuthForm" class="relative space-y-3">

            <div class="space-y-1.5">
                <label for="authEmailInput" class="text-lux-400 text-[11px] font-bold">البريد الإلكتروني</label>
                <input id="authEmailInput" type="email" required autocomplete="email"
                       placeholder="example@email.com"
                       class="w-full bg-lux-900/60 border border-gold-500/20 focus:border-gold-500/50
                              rounded-xl px-3.5 py-2.5 text-lux-100 text-sm placeholder-lux-500
                              outline-none transition-colors text-left" dir="ltr" />
            </div>

            <div class="space-y-1.5">
                <label for="authPasswordInput" class="text-lux-400 text-[11px] font-bold">كلمة المرور</label>
                <input id="authPasswordInput" type="password" required autocomplete="current-password"
                       minlength="6" placeholder="••••••••"
                       class="w-full bg-lux-900/60 border border-gold-500/20 focus:border-gold-500/50
                              rounded-xl px-3.5 py-2.5 text-lux-100 text-sm placeholder-lux-500
                              outline-none transition-colors text-left" dir="ltr" />
            </div>

            <button id="btnEmailAuthSubmit" type="submit"
                    class="w-full bg-gold-500 hover:bg-gold-400 text-lux-900 font-extrabold text-sm
                           rounded-2xl py-3 transition-colors flex items-center justify-center gap-2">
                <span id="btnEmailAuthSubmitText">تسجيل الدخول</span>
                <svg id="authLoadingSpinner" class="hidden animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
                </svg>
            </button>
        </form>

        <!-- تبديل بين تسجيل الدخول وإنشاء حساب جديد -->
        <p class="relative text-center text-lux-400 text-[11px] font-bold">
            <span id="authToggleLabel">لسه معندكش حساب؟</span>
            <button id="btnToggleAuthMode" type="button" class="text-gold-400 hover:text-gold-300 font-extrabold">
                سجّل دلوقتي
            </button>
        </p>

    </div>
</div>


<!-- ================================================= -->
<!-- 2) موديل "إعداد البطل لأول مرة"                    -->
<!-- ================================================= -->
<div id="firstTimeProfileModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">

    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>

    <div class="relative w-full max-w-sm bg-lux-800/60 backdrop-blur-xl border border-gold-500/25
                rounded-3xl shadow-2xl shadow-gold-500/10 p-6 space-y-5 overflow-hidden max-h-[92vh] overflow-y-auto">

        <div class="pointer-events-none absolute -top-16 -left-16 w-40 h-40 bg-gold-500/20 rounded-full blur-3xl"></div>

        <!-- عنوان -->
        <div class="relative text-center space-y-1">
            <h1 class="text-lux-100 font-extrabold text-lg">إعداد البطل لأول مرة</h1>
            <p class="text-lux-400 text-xs font-bold">جهّز بروفايلك قبل ما تبدأ الرحلة</p>
        </div>

        <!-- اختيار / رفع الصورة الشخصية -->
        <div class="relative flex flex-col items-center space-y-2.5">
            <div class="relative">
                <img id="setupAvatarPreview" src="https://placehold.co/160x160/14b8a6/ffffff?text=بطل"
                     alt="الصورة الشخصية"
                     class="w-24 h-24 rounded-full object-cover border-2 border-gold-500/40 badge-glow" />
                <button id="btnUploadAvatar" type="button" aria-label="رفع صورة شخصية"
                        class="absolute -bottom-1 -left-1 w-8 h-8 rounded-full bg-gold-500 text-lux-900
                               flex items-center justify-center text-sm shadow-lg">📷</button>
                <input id="avatarFileInput" type="file" accept="image/*" class="hidden" />
            </div>

            <!-- شبكة أفاتارات افتراضية -->
            <div id="defaultAvatarsGrid" class="flex items-center justify-center gap-2"></div>
        </div>

        <!-- فورم البيانات -->
        <form id="firstTimeProfileForm" class="relative space-y-3">

            <div class="space-y-1.5">
                <label for="setupHeroNameInput" class="text-lux-400 text-[11px] font-bold">اسم البطل</label>
                <input id="setupHeroNameInput" type="text" required maxlength="30"
                       placeholder="اكتب اسمك هنا"
                       class="w-full bg-lux-900/60 border border-gold-500/20 focus:border-gold-500/50
                              rounded-xl px-3.5 py-2.5 text-lux-100 text-sm placeholder-lux-500
                              outline-none transition-colors" />
            </div>

            <div class="space-y-1.5">
                <label for="setupTitleSelect" class="text-lux-400 text-[11px] font-bold">اللقب المفضل</label>
                <select id="setupTitleSelect"
                        class="w-full bg-lux-900/60 border border-gold-500/20 focus:border-gold-500/50
                               rounded-xl px-3.5 py-2.5 text-lux-100 text-sm outline-none transition-colors">
                    <option value="ابن البلد" selected>ابن البلد</option>
                    <option value="بطل الحتة">بطل الحتة</option>
                    <option value="فارس الرياضة">فارس الرياضة</option>
                    <option value="ملك الالتزام">ملك الالتزام</option>
                    <option value="نجم صاعد">نجم صاعد</option>
                </select>
            </div>

            <button id="btnStartJourney" type="submit"
                    class="w-full bg-gold-500 hover:bg-gold-400 text-lux-900 font-extrabold text-sm
                           rounded-2xl py-3 transition-colors flex items-center justify-center gap-2 mt-1">
                <span id="btnStartJourneyText">ابدأ الرحلة 🚀</span>
                <svg id="profileSetupLoadingSpinner" class="hidden animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
                </svg>
            </button>
        </form>

    </div>
</div>


<!-- ============================= -->
<!-- 3) حاوية التوستات الخفيفة     -->
<!-- ============================= -->
<div id="toastContainer" class="fixed bottom-5 inset-x-0 z-[60] flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

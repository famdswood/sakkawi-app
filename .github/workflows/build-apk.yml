name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sekkawy APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      # -------------------------------------------------------------
      # 1) Build Main App APK (Sekkawy.apk)
      # -------------------------------------------------------------
      - name: Build Main Sekkawy APK
        run: |
          mkdir -p release-apks
          npx cap sync android
          cd android
          ./gradlew assembleDebug --stacktrace
          cd app/build/outputs/apk/debug
          if [ -f Sekkawy.apk ]; then
            cp Sekkawy.apk ../../../../../release-apks/Sekkawy.apk
          elif [ -f app-debug.apk ]; then
            cp app-debug.apk ../../../../../release-apks/Sekkawy.apk
          fi
          cd ../../../../..
          rm -rf android/app/build/outputs/apk/debug/*

      # -------------------------------------------------------------
      # 2) Prepare & Build Admin App APK (Sekkawy-Admin.apk)
      # -------------------------------------------------------------
      - name: Build Admin Sekkawy APK
        run: |
          node scripts/prepare-admin-build.js
          npx cap sync android
          cd android
          ./gradlew assembleDebug --stacktrace
          cd app/build/outputs/apk/debug
          if [ -f Sekkawy-Admin.apk ]; then
            cp Sekkawy-Admin.apk ../../../../../release-apks/Sekkawy-Admin.apk
          elif [ -f Sekkawy.apk ]; then
            cp Sekkawy.apk ../../../../../release-apks/Sekkawy-Admin.apk
          elif [ -f app-debug.apk ]; then
            cp app-debug.apk ../../../../../release-apks/Sekkawy-Admin.apk
          fi
          cd ../../../../..
          node scripts/restore-main-build.js
          ls -lh release-apks/

      # -------------------------------------------------------------
      # 3) Upload APK Artifacts
      # -------------------------------------------------------------
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sekkawy-APKs
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------------
      # 4) Create GitHub Release with both APKs
      # -------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ github.run_number }}
          name: "Sekkawy v${{ github.run_number }}"
          files: |
            release-apks/Sekkawy.apk
            release-apks/Sekkawy-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
